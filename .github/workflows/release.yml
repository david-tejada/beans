name: release

# A push to main whose package.json version has no tag yet is a release: the
# .vsix goes to Open VSX and the Marketplace, then the tag and the GitHub
# release are made. A merge that doesn't bump the version does nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write # the tag and the GitHub release
  id-token: write # Marketplace Trusted Publishing

# One release at a time; a second merge waits for the first.
concurrency: release

env:
  # Hooks are for working copies, not runners.
  VP_GIT_HOOKS: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is this version tagged already?
        id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # ls-remote exits 0 when the tag exists and 2 when it doesn't;
          # anything else is a failure to ask, not a new version.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case $status in
            0) echo "v$version is tagged already; nothing to release."; echo "new=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "v$version is new; releasing."; echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "git ls-remote failed ($status)"; exit "$status" ;;
          esac

  publish:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and type checks
        run: pnpm exec vp check
      - name: Unit tests
        run: pnpm exec vp test --run --project unit
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mts > notes.md
      - name: Package
        run: pnpm package
      # Both publishes skip a version the registry already has, so a run that
      # failed halfway can be rerun.
      - name: Publish to Open VSX
        # Until the david-tejada namespace is verified
        # (EclipseFdn/open-vsx.org#15099), a token. Then drop the secret and
        # the check below: without a token, ovsx exchanges the GitHub ID token
        # itself.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$OVSX_PAT" ] || { echo "The OVSX_PAT secret is missing."; exit 1; }
          pnpm exec ovsx publish "beans-$VERSION.vsix" --skip-duplicate
      - name: Publish to the Marketplace
        run: pnpm exec vsce publish --oidc --packagePath "beans-$VERSION.vsix" --skip-duplicate
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "beans-$VERSION.vsix" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
