name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Hooks are for working copies, not runners.
  VP_GIT_HOOKS: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and type checks
        run: pnpm exec vp check
      - name: Unit tests
        run: pnpm exec vp test --run --project unit
      - name: A version bump brings its CHANGELOG section
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if [ "$(git show FETCH_HEAD:package.json | jq -r .version)" != "$(jq -r .version package.json)" ]; then
            node scripts/release-notes.mts > /dev/null
          fi
      - name: Package
        run: pnpm package
      - name: Keep the .vsix, to try this change in VS Code
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beans-vsix
          path: "*.vsix"
          if-no-files-found: error

  # Hints, expand and collapse, the Command Palette and a pick, in a downloaded
  # VS Code: the newest, and the oldest engines.vscode allows. The one check
  # that notices when VS Code renames a class.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, "1.90.2"]
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hints in a real VS Code
        run: xvfb-run -a pnpm test:integration

  # The same test in the Theia IDE, whose sidebars are its own, so a release
  # can rename what Beans hints there. Its own job, so a Theia break doesn't
  # hide a VS Code one. Pinned here, so a new Theia release doesn't fail an
  # unrelated pull request; the weekly run tries the newest.
  integration-theia:
    runs-on: ubuntu-latest
    env:
      BEANS_TEST_EDITOR: theia
      THEIA_VERSION: "1.76.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned Theia, unpacked, so a pull request doesn't fetch 400 MB
      # from download.eclipse.org each time. The weekly run of the newest
      # downloads it fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .theia-test
          key: theia-${{ runner.os }}-${{ env.THEIA_VERSION }}
      - name: Hints in a real Theia IDE
        run: xvfb-run -a pnpm test:integration:theia
