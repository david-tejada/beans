name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Hooks are for working copies, not runners.
  VP_GIT_HOOKS: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and type checks
        run: pnpm exec vp check
      - name: Unit tests
        run: pnpm exec vp test --run
      - name: A version bump brings its CHANGELOG section
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if [ "$(git show FETCH_HEAD:package.json | jq -r .version)" != "$(jq -r .version package.json)" ]; then
            node scripts/release-notes.mts > /dev/null
          fi
      - name: Package
        run: pnpm package
      - name: Keep the .vsix, to try this change in VS Code
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beans-vsix
          path: "*.vsix"
          if-no-files-found: error
